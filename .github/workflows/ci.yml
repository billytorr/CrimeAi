name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      # Type safety across the app
      - run: npm run typecheck
      # Unit tests — includes the Rule 1 safety-path assertion, which
      # fails the build if any entitlement reference lands in a safety file.
      - run: npm test
